services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped  # Docker Desktop mở lúc đăng nhập Windows là Postgres lên theo
    environment:
      POSTGRES_USER: troly
      POSTGRES_PASSWORD: troly
      POSTGRES_DB: troly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
